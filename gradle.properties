# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

## Project Kafka

projectkafka.version-code=1
projectkafka.version-name=1.0

projectkafka.android.compile-sdk=37
projectkafka.android.target-sdk=37
projectkafka.android.min-sdk=37

projectkafka.jvm.target=17

projectkafka.codestyle.detekt.baseline=config/detekt/baseline.xml
projectkafka.codestyle.detekt.config=config/detekt/detekt.yml

projectkafka.codestyle.lint.baseline=config/lint/baseline.xml
projectkafka.codestyle.lint.config=config/lint/config.xml

projectkafka.compose.stability-file=config/compose/compose.conf

## Gradle

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true

# Enable Isolated Projects feature
# https://docs.gradle.org/current/userguide/isolated_projects.html
org.gradle.isolated-projects=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Caching
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# Use Configure On Demand
# https://docs.gradle.org/current/userguide/configuration_on_demand.html
org.gradle.configureondemand=true

# Enable Toolchain Auto detection and download
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true

## Android

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# Create BuildConfig files as bytecode to avoid Java compilation phase
android.enableBuildConfigAsBytecode=true

## Kotlin

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
kotlin.incremental=true

## Compose

# Use JetBrains runtime 25
compose.reload.jbr.version=25

## KSP

# Support running KSP with isolated project
ksp.project.isolation.enabled=true
